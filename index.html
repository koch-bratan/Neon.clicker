<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Neon Clicker</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at center, #10002b 0%, #05000f 70%, #000 100%);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    touch-action: manipulation;
    position: fixed;
  }

  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ===== Кнопка звука ===== */
  #soundBtn {
    position: absolute;
    top: 4vh;
    right: 4vw;
    width: 13vw;
    height: 13vw;
    max-width: 60px;
    max-height: 60px;
    min-width: 42px;
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 6vw;
    line-height: 1;
    color: #0ff;
    background: rgba(0, 255, 255, 0.08);
    border: 2px solid rgba(0, 255, 255, 0.7);
    border-radius: 50%;
    box-shadow:
      0 0 12px rgba(0, 255, 255, 0.6),
      inset 0 0 10px rgba(0, 255, 255, 0.3);
    text-shadow: 0 0 8px #0ff;
    z-index: 9999;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
    touch-action: manipulation;
    font-family: inherit;
  }

  #soundBtn:active {
    transform: scale(0.9);
  }

  #soundBtn.muted {
    color: #ff5555;
    border-color: rgba(255, 85, 85, 0.7);
    box-shadow:
      0 0 12px rgba(255, 85, 85, 0.5),
      inset 0 0 10px rgba(255, 85, 85, 0.25);
    text-shadow: 0 0 8px #ff5555;
    opacity: 0.75;
  }

  #scoreBox {
    position: absolute;
    top: 4vh;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 5;
    pointer-events: none;
  }

  #score {
    font-size: 12vw;
    font-weight: 900;
    color: #fff;
    text-shadow:
      0 0 10px #0ff,
      0 0 20px #0ff,
      0 0 40px #0ff,
      0 0 80px #0ff;
    transition: transform 0.15s ease-out;
  }

  #score.pop {
    transform: scale(1.15);
  }

  #scoreLabel {
    font-size: 3vw;
    letter-spacing: 4px;
    color: #7cfaff;
    text-transform: uppercase;
    opacity: 0.7;
    margin-top: -4px;
  }

  #incomeLabel {
    font-size: 3.2vw;
    margin-top: 4px;
    color: #7fff7f;
    text-shadow: 0 0 8px #7fff7f, 0 0 16px #7fff7f;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  #incomeLabel.visible {
    opacity: 1;
  }

  #sphereWrap {
    position: relative;
    width: 55vmin;
    height: 55vmin;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 10vh;
  }

  #sphere {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #ffffff 0%, #a0ffff 12%, #00e5ff 40%, #0088ff 70%, #001a4d 100%);
    box-shadow:
      0 0 30px #00e5ff,
      0 0 60px #00e5ff,
      0 0 120px #00b3ff,
      inset 0 0 40px rgba(255,255,255,0.6),
      inset 0 0 80px rgba(0,180,255,0.5);
    transition: transform 0.09s cubic-bezier(.2,.9,.3,1.4);
    cursor: pointer;
    animation: float 3s ease-in-out infinite;
    touch-action: manipulation;
  }

  #sphere.hit {
    transform: scale(0.85);
  }

  @keyframes float {
    0%, 100% { box-shadow: 0 0 30px #00e5ff, 0 0 60px #00e5ff, 0 0 120px #00b3ff, inset 0 0 40px rgba(255,255,255,0.6), inset 0 0 80px rgba(0,180,255,0.5); }
    50% { box-shadow: 0 0 40px #00e5ff, 0 0 80px #00e5ff, 0 0 160px #00b3ff, inset 0 0 50px rgba(255,255,255,0.8), inset 0 0 90px rgba(0,180,255,0.7); }
  }

  #sphere::after {
    content: "";
    position: absolute;
    top: 12%;
    left: 20%;
    width: 30%;
    height: 22%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(255,255,255,0) 70%);
    filter: blur(4px);
    pointer-events: none;
  }

  .spark {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 10;
    will-change: transform, opacity;
  }

  #shopBtn {
    position: absolute;
    bottom: 4vh;
    left: 50%;
    transform: translateX(-50%);
    padding: 18px 42px;
    font-size: 5vw;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ff47ff;
    background: rgba(255, 0, 255, 0.08);
    border: 2px solid #ff47ff;
    border-radius: 60px;
    box-shadow:
      0 0 15px #ff47ff,
      0 0 30px rgba(255,71,255,0.5),
      inset 0 0 15px rgba(255,71,255,0.4);
    text-shadow: 0 0 10px #ff47ff, 0 0 20px #ff47ff;
    z-index: 20;
    transition: transform 0.1s ease;
    cursor: pointer;
    touch-action: manipulation;
    font-family: inherit;
  }

  #shopModal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 20, 0.88);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    overflow-y: auto;
  }

  #shopModal.open {
    display: flex;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  #shopContent {
    width: 100%;
    max-width: 500px;
    background: rgba(20, 0, 40, 0.95);
    border: 2px solid #0ff;
    border-radius: 24px;
    padding: 26px 22px;
    box-shadow:
      0 0 30px #0ff,
      0 0 60px rgba(0,255,255,0.4),
      inset 0 0 30px rgba(0,255,255,0.15);
    text-align: center;
    margin: auto;
  }

  #shopContent h2 {
    font-size: 7.5vw;
    margin-bottom: 20px;
    color: #0ff;
    text-shadow: 0 0 10px #0ff, 0 0 25px #0ff;
    letter-spacing: 3px;
  }

  .upgrade {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: rgba(0, 255, 255, 0.06);
    border: 1px solid rgba(0, 255, 255, 0.4);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 14px;
  }

  .upgrade.robot {
    background: rgba(127, 255, 127, 0.06);
    border-color: rgba(127, 255, 127, 0.4);
  }

  .upgrade-info {
    text-align: left;
    flex: 1;
    min-width: 0;
  }

  .upgrade-title {
    font-size: 4.4vw;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 8px #0ff;
  }

  .upgrade.robot .upgrade-title {
    text-shadow: 0 0 8px #7fff7f;
  }

  .upgrade-desc {
    font-size: 3.3vw;
    color: #7cfaff;
    opacity: 0.85;
    margin-top: 4px;
  }

  .upgrade.robot .upgrade-desc {
    color: #b3ffb3;
  }

  .upgrade-count {
    display: inline-block;
    margin-top: 4px;
    font-size: 3vw;
    color: #7fff7f;
    text-shadow: 0 0 6px #7fff7f;
    font-weight: 700;
  }

  .buyBtn {
    padding: 12px 18px;
    font-size: 3.7vw;
    font-weight: 800;
    color: #0ff;
    background: rgba(0, 255, 255, 0.1);
    border: 2px solid #0ff;
    border-radius: 12px;
    box-shadow: 0 0 12px #0ff, inset 0 0 10px rgba(0,255,255,0.3);
    text-shadow: 0 0 8px #0ff;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.1s;
    font-family: inherit;
    touch-action: manipulation;
  }

  .buyBtn.robot {
    color: #7fff7f;
    border-color: #7fff7f;
    background: rgba(127, 255, 127, 0.1);
    box-shadow: 0 0 12px #7fff7f, inset 0 0 10px rgba(127,255,127,0.3);
    text-shadow: 0 0 8px #7fff7f;
  }

  .buyBtn:disabled {
    opacity: 0.35;
    box-shadow: none;
    cursor: not-allowed;
  }

  .buyBtn.owned {
    color: #7fff7f;
    border-color: #7fff7f;
    box-shadow: 0 0 12px #7fff7f, inset 0 0 10px rgba(127,255,127,0.3);
    text-shadow: 0 0 8px #7fff7f;
  }

  #closeBtn {
    margin-top: 8px;
    padding: 14px 40px;
    font-size: 4vw;
    font-weight: 800;
    color: #ff47ff;
    background: rgba(255, 0, 255, 0.08);
    border: 2px solid #ff47ff;
    border-radius: 40px;
    box-shadow: 0 0 15px #ff47ff, inset 0 0 12px rgba(255,71,255,0.3);
    text-shadow: 0 0 8px #ff47ff;
    cursor: pointer;
    transition: transform 0.1s;
    font-family: inherit;
    touch-action: manipulation;
  }

  #resetBtn {
    margin-top: 12px;
    padding: 8px 20px;
    font-size: 2.8vw;
    color: #ff5555;
    background: transparent;
    border: 1px solid rgba(255, 85, 85, 0.4);
    border-radius: 20px;
    opacity: 0.6;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
  }

  @media (orientation: landscape) {
    #score { font-size: 8vh; }
    #scoreLabel { font-size: 2vh; }
    #incomeLabel { font-size: 2.1vh; }
    #sphereWrap { width: 40vh; height: 40vh; margin-top: 4vh; }
    #shopBtn { font-size: 3vh; padding: 12px 30px; bottom: 3vh; }
    #shopContent h2 { font-size: 4.5vh; margin-bottom: 12px; }
    .upgrade-title { font-size: 2.5vh; }
    .upgrade-desc { font-size: 1.9vh; }
    .upgrade-count { font-size: 1.7vh; }
    .buyBtn { font-size: 2.1vh; padding: 10px 16px; }
    #closeBtn { font-size: 2.3vh; }
    #resetBtn { font-size: 1.6vh; }
    #soundBtn { width: 8vh; height: 8vh; font-size: 4vh; top: 3vh; right: 3vw; }
  }
</style>
</head>
<body>

<!-- Кнопка звука в верхнем правом углу -->
<button id="soundBtn">🔊</button>

<div id="game">
  <div id="scoreBox">
    <div id="score">0</div>
    <div id="scoreLabel">очки</div>
    <div id="incomeLabel">+0 / сек</div>
  </div>

  <div id="sphereWrap">
    <div id="sphere"></div>
  </div>

  <button id="shopBtn">✦ Магазин</button>
</div>

<div id="shopModal">
  <div id="shopContent">
    <h2>МАГАЗИН</h2>

    <div class="upgrade">
      <div class="upgrade-info">
        <div class="upgrade-title">Мультиклик</div>
        <div class="upgrade-desc">+1 к клику (итого +2)</div>
      </div>
      <button class="buyBtn" id="buyMulti">50</button>
    </div>

    <div class="upgrade robot">
      <div class="upgrade-info">
        <div class="upgrade-title">🤖 Робот-кликер</div>
        <div class="upgrade-desc">+1 очко в секунду</div>
        <div class="upgrade-count" id="robotCount">Куплено: 0</div>
      </div>
      <button class="buyBtn robot" id="buyRobot">150</button>
    </div>

    <button id="closeBtn">Закрыть</button>
    <br>
    <button id="resetBtn">Сбросить прогресс</button>
  </div>
</div>

<script>
(function() {
  // ===== Константы =====
  var SAVE_KEY = 'neonClickerSave_v1';
  var MULTI_COST = 50;
  var ROBOT_COST = 150;
  var SOUND_URL = 'sound.mp3';

  // ===== Состояние игры =====
  var score = 0;
  var clickValue = 1;
  var multiOwned = false;
  var robots = 0;
  var incomePerSec = 0;
  var soundEnabled = true;

  // ===== DOM =====
  var scoreEl      = document.getElementById('score');
  var incomeEl     = document.getElementById('incomeLabel');
  var sphere       = document.getElementById('sphere');
  var shopBtn      = document.getElementById('shopBtn');
  var shopModal    = document.getElementById('shopModal');
  var closeBtn     = document.getElementById('closeBtn');
  var resetBtn     = document.getElementById('resetBtn');
  var buyMulti     = document.getElementById('buyMulti');
  var buyRobot     = document.getElementById('buyRobot');
  var robotCountEl = document.getElementById('robotCount');
  var soundBtn     = document.getElementById('soundBtn');

  // ===== АУДИО: один объект, каждый клик перезапускает его с нуля =====
  // Это устраняет наложение звуков и эхо при частых кликах.
  var clickSound = null;

  function initSound() {
    try {
      clickSound = new Audio(SOUND_URL);
      clickSound.preload = 'auto';
      clickSound.volume = 0.75;
      clickSound.load();
    } catch (e) {
      clickSound = null;
    }
  }

  function playClickSound() {
    if (!soundEnabled) return;
    if (!clickSound) return;
    try {
      // 1) Полностью останавливаем предыдущий звук
      clickSound.pause();
      // 2) Сбрасываем на нулевую секунду
      clickSound.currentTime = 0;
      // 3) Играем заново
      var p = clickSound.play();
      if (p && p.catch) p.catch(function(){});
    } catch (e) {}
  }

  // Разблокировка аудио при первом касании (обход autoplay-политики браузеров)
  var audioUnlocked = false;
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    if (!clickSound) return;
    try {
      var prevVol = clickSound.volume;
      clickSound.volume = 0;
      var p = clickSound.play();
      if (p && p.then) {
        p.then(function() {
          clickSound.pause();
          clickSound.currentTime = 0;
          clickSound.volume = prevVol;
        }).catch(function() {
          clickSound.volume = prevVol;
        });
      } else {
        clickSound.pause();
        clickSound.currentTime = 0;
        clickSound.volume = prevVol;
      }
    } catch (e) {}
  }

  // ===== СОХРАНЕНИЕ / ЗАГРУЗКА =====
  function save() {
    try {
      var data = {
        score: score,
        clickValue: clickValue,
        multiOwned: multiOwned,
        robots: robots,
        soundEnabled: soundEnabled,
        timestamp: Date.now()
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    } catch (e) {
      console.warn('Не удалось сохранить:', e);
    }
  }

  function load() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (typeof data.score === 'number')         score = data.score;
      if (typeof data.clickValue === 'number')    clickValue = data.clickValue;
      if (typeof data.multiOwned === 'boolean')   multiOwned = data.multiOwned;
      if (typeof data.robots === 'number')        robots = data.robots;
      if (typeof data.soundEnabled === 'boolean') soundEnabled = data.soundEnabled;
    } catch (e) {
      console.warn('Не удалось загрузить сохранение:', e);
    }
  }

  function hardReset() {
    if (!confirm('Точно сбросить весь прогресс? Это нельзя отменить.')) return;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    score = 0;
    clickValue = 1;
    multiOwned = false;
    robots = 0;
    soundEnabled = true;
    refreshSoundBtn();
    refreshAll();
    save();
  }

  // ===== Рендер =====
  function updateIncome() {
    incomePerSec = robots;
    if (incomePerSec > 0) {
      incomeEl.textContent = '+' + incomePerSec + ' / сек';
      incomeEl.classList.add('visible');
    } else {
      incomeEl.classList.remove('visible');
    }
  }

  function updateScore(pop) {
    scoreEl.textContent = Math.floor(score);
    if (pop) {
      scoreEl.classList.add('pop');
      setTimeout(function() { scoreEl.classList.remove('pop'); }, 120);
    }
    refreshShop();
  }

  function refreshAll() {
    updateScore(false);
    updateIncome();
    refreshShop();
  }

  function refreshShop() {
    if (multiOwned) {
      buyMulti.disabled = true;
      buyMulti.classList.add('owned');
      buyMulti.textContent = 'Куплено';
    } else {
      buyMulti.disabled = score < MULTI_COST;
      buyMulti.classList.remove('owned');
      buyMulti.textContent = MULTI_COST;
    }

    robotCountEl.textContent = 'Куплено: ' + robots;
    buyRobot.disabled = score < ROBOT_COST;
    buyRobot.textContent = ROBOT_COST;
  }

  function refreshSoundBtn() {
    if (soundEnabled) {
      soundBtn.textContent = '🔊';
      soundBtn.classList.remove('muted');
    } else {
      soundBtn.textContent = '🔇';
      soundBtn.classList.add('muted');
    }
  }

  // ===== Искры =====
  var sparkColors = ['#00e5ff', '#0ff', '#7cfaff', '#ff47ff', '#a56bff', '#ffffff'];

  function spawnSparks(x, y) {
    var count = 14 + Math.floor(Math.random() * 6);
    for (var i = 0; i < count; i++) {
      (function() {
        var s = document.createElement('div');
        s.className = 'spark';
        var color = sparkColors[Math.floor(Math.random() * sparkColors.length)];
        var size = 6 + Math.random() * 12;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = x + 'px';
        s.style.top = y + 'px';
        s.style.background = color;
        s.style.boxShadow = '0 0 ' + size + 'px ' + color + ', 0 0 ' + (size * 2) + 'px ' + color;
        document.body.appendChild(s);

        var angle = Math.random() * Math.PI * 2;
        var dist = 80 + Math.random() * 160;
        var dx = Math.cos(angle) * dist;
        var dy = Math.sin(angle) * dist;
        var duration = 600 + Math.random() * 400;

        var anim = s.animate(
          [
            { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
            { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(0)', opacity: 0 }
          ],
          { duration: duration, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' }
        );

        if (anim && anim.onfinish !== undefined) {
          anim.onfinish = function() { s.remove(); };
        } else {
          setTimeout(function() { s.remove(); }, duration + 50);
        }
      })();
    }
  }

  // ===== Антидребезг для сферы =====
  var lastHitTime = 0;
  function canFire() {
    var now = Date.now();
    if (now - lastHitTime < 40) return false;
    lastHitTime = now;
    return true;
  }

  // ===== Клик по сфере =====
  function handleHit(e) {
    if (e) {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
    }
    if (!canFire()) return;

    unlockAudio();

    score += clickValue;
    updateScore(true);

    sphere.classList.add('hit');
    setTimeout(function() { sphere.classList.remove('hit'); }, 100);

    var rect = sphere.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    spawnSparks(cx, cy);

    playClickSound();

    if (navigator.vibrate) {
      try { navigator.vibrate(15); } catch (err) {}
    }

    save();
  }

  // ===== Магазин =====
  function openShop(e) {
    if (e) {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
    }
    refreshShop();
    shopModal.classList.add('open');
  }

  function closeShop(e) {
    if (e) {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
    }
    shopModal.classList.remove('open');
  }

  function buyMultiFunc(e) {
    if (e) {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
    }
    if (multiOwned) return;
    if (score < MULTI_COST) return;
    score -= MULTI_COST;
    clickValue = 2;
    multiOwned = true;
    updateScore(true);
    save();
  }

  function buyRobotFunc(e) {
    if (e) {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
    }
    if (score < ROBOT_COST) return;
    score -= ROBOT_COST;
    robots += 1;
    updateScore(true);
    updateIncome();
    refreshShop();
    save();
  }

  // ===== Кнопка звука с антидребезгом (ключевой фикс!) =====
  var lastSoundToggleTime = 0;
  function toggleSound(e) {
    if (e) {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
    }
    // Защита от 4-кратного срабатывания за одно касание
    var now = Date.now();
    if (now - lastSoundToggleTime < 350) return;
    lastSoundToggleTime = now;

    soundEnabled = !soundEnabled;
    refreshSoundBtn();

    // Если выключаем — сразу останавливаем звук, чтобы он не доигрывал
    if (!soundEnabled && clickSound) {
      try {
        clickSound.pause();
        clickSound.currentTime = 0;
      } catch (err) {}
    }

    // Если включаем — разблокируем аудио
    if (soundEnabled) {
      unlockAudio();
    }

    if (navigator.vibrate) {
      try { navigator.vibrate(20); } catch (err) {}
    }

    save();
  }

  // ===== Экспорт в window (не нужен, но оставлен для совместимости) =====
  window.__hit         = handleHit;
  window.__openShop    = openShop;
  window.__closeShop   = closeShop;
  window.__buyMulti    = buyMultiFunc;
  window.__buyRobot    = buyRobotFunc;
  window.__reset       = hardReset;
  window.__toggleSound = toggleSound;

  // ===== Подписки =====
  function bind(el, fn) {
    if (!el) return;
    el.addEventListener('touchstart', fn, { passive: false });
    el.addEventListener('mousedown', fn);
    el.addEventListener('click', fn);
  }

  bind(sphere, handleHit);
  bind(shopBtn, openShop);
  bind(closeBtn, closeShop);
  bind(buyMulti, buyMultiFunc);
  bind(buyRobot, buyRobotFunc);
  bind(resetBtn, hardReset);
  bind(soundBtn, toggleSound);

  shopModal.addEventListener('click', function(e) {
    if (e.target === shopModal) shopModal.classList.remove('open');
  });

  // ===== Запрет контекстного меню и зума =====
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
  document.addEventListener('touchmove', function(e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  // ===== АВТОКЛИКЕР =====
  setInterval(function() {
    if (robots > 0) {
      score += robots;
      scoreEl.textContent = Math.floor(score);
      refreshShop();
    }
  }, 1000);

  // ===== Автосохранение каждые 5 секунд =====
  setInterval(save, 5000);

  window.addEventListener('beforeunload', save);
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') save();
  });

  // ===== Инициализация =====
  initSound();
  load();
  refreshSoundBtn();
  refreshAll();

  // Разблокировка аудио при первом касании в любом месте
  document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
  document.addEventListener('mousedown', unlockAudio, { once: true });
})();
</script>
</body>
</html>
