<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Neon Clicker</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at center, #10002b 0%, #05000f 70%, #000 100%);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    touch-action: manipulation;
    position: fixed;
  }

  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #scoreBox {
    position: absolute;
    top: 6vh;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 5;
    pointer-events: none;
  }

  #score {
    font-size: 12vw;
    font-weight: 900;
    color: #fff;
    text-shadow:
      0 0 10px #0ff,
      0 0 20px #0ff,
      0 0 40px #0ff,
      0 0 80px #0ff;
    transition: transform 0.15s ease-out;
  }

  #score.pop {
    transform: scale(1.15);
  }

  #scoreLabel {
    font-size: 3.5vw;
    letter-spacing: 4px;
    color: #7cfaff;
    text-transform: uppercase;
    opacity: 0.7;
    margin-top: -4px;
  }

  #sphereWrap {
    position: relative;
    width: 60vmin;
    height: 60vmin;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 6vh;
  }

  #sphere {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #ffffff 0%, #a0ffff 12%, #00e5ff 40%, #0088ff 70%, #001a4d 100%);
    box-shadow:
      0 0 30px #00e5ff,
      0 0 60px #00e5ff,
      0 0 120px #00b3ff,
      inset 0 0 40px rgba(255,255,255,0.6),
      inset 0 0 80px rgba(0,180,255,0.5);
    transition: transform 0.09s cubic-bezier(.2,.9,.3,1.4);
    cursor: pointer;
    animation: float 3s ease-in-out infinite;
    touch-action: manipulation;
  }

  #sphere.hit {
    transform: scale(0.85);
  }

  @keyframes float {
    0%, 100% { box-shadow: 0 0 30px #00e5ff, 0 0 60px #00e5ff, 0 0 120px #00b3ff, inset 0 0 40px rgba(255,255,255,0.6), inset 0 0 80px rgba(0,180,255,0.5); }
    50% { box-shadow: 0 0 40px #00e5ff, 0 0 80px #00e5ff, 0 0 160px #00b3ff, inset 0 0 50px rgba(255,255,255,0.8), inset 0 0 90px rgba(0,180,255,0.7); }
  }

  #sphere::after {
    content: "";
    position: absolute;
    top: 12%;
    left: 20%;
    width: 30%;
    height: 22%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(255,255,255,0) 70%);
    filter: blur(4px);
    pointer-events: none;
  }

  .spark {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 10;
    will-change: transform, opacity;
  }

  #shopBtn {
    position: absolute;
    bottom: 5vh;
    left: 50%;
    transform: translateX(-50%);
    padding: 18px 42px;
    font-size: 5vw;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ff47ff;
    background: rgba(255, 0, 255, 0.08);
    border: 2px solid #ff47ff;
    border-radius: 60px;
    box-shadow:
      0 0 15px #ff47ff,
      0 0 30px rgba(255,71,255,0.5),
      inset 0 0 15px rgba(255,71,255,0.4);
    text-shadow: 0 0 10px #ff47ff, 0 0 20px #ff47ff;
    z-index: 20;
    transition: transform 0.1s ease;
    cursor: pointer;
    touch-action: manipulation;
    font-family: inherit;
  }

  #shopModal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 20, 0.88);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  #shopModal.open {
    display: flex;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  #shopContent {
    width: 100%;
    max-width: 480px;
    background: rgba(20, 0, 40, 0.95);
    border: 2px solid #0ff;
    border-radius: 24px;
    padding: 30px 24px;
    box-shadow:
      0 0 30px #0ff,
      0 0 60px rgba(0,255,255,0.4),
      inset 0 0 30px rgba(0,255,255,0.15);
    text-align: center;
  }

  #shopContent h2 {
    font-size: 8vw;
    margin-bottom: 24px;
    color: #0ff;
    text-shadow: 0 0 10px #0ff, 0 0 25px #0ff;
    letter-spacing: 3px;
  }

  .upgrade {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    background: rgba(0, 255, 255, 0.06);
    border: 1px solid rgba(0, 255, 255, 0.4);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .upgrade-info {
    text-align: left;
    flex: 1;
  }

  .upgrade-title {
    font-size: 4.5vw;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 8px #0ff;
  }

  .upgrade-desc {
    font-size: 3.5vw;
    color: #7cfaff;
    opacity: 0.85;
    margin-top: 4px;
  }

  .buyBtn {
    padding: 12px 20px;
    font-size: 3.8vw;
    font-weight: 800;
    color: #0ff;
    background: rgba(0, 255, 255, 0.1);
    border: 2px solid #0ff;
    border-radius: 12px;
    box-shadow: 0 0 12px #0ff, inset 0 0 10px rgba(0,255,255,0.3);
    text-shadow: 0 0 8px #0ff;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.1s;
    font-family: inherit;
    touch-action: manipulation;
  }

  .buyBtn:disabled {
    opacity: 0.35;
    box-shadow: none;
    cursor: not-allowed;
  }

  .buyBtn.owned {
    color: #7fff7f;
    border-color: #7fff7f;
    box-shadow: 0 0 12px #7fff7f, inset 0 0 10px rgba(127,255,127,0.3);
    text-shadow: 0 0 8px #7fff7f;
  }

  #closeBtn {
    margin-top: 10px;
    padding: 14px 40px;
    font-size: 4vw;
    font-weight: 800;
    color: #ff47ff;
    background: rgba(255, 0, 255, 0.08);
    border: 2px solid #ff47ff;
    border-radius: 40px;
    box-shadow: 0 0 15px #ff47ff, inset 0 0 12px rgba(255,71,255,0.3);
    text-shadow: 0 0 8px #ff47ff;
    cursor: pointer;
    transition: transform 0.1s;
    font-family: inherit;
    touch-action: manipulation;
  }

  @media (orientation: landscape) {
    #score { font-size: 8vh; }
    #scoreLabel { font-size: 2.2vh; }
    #sphereWrap { width: 45vh; height: 45vh; margin-top: 2vh; }
    #shopBtn { font-size: 3vh; padding: 12px 30px; bottom: 3vh; }
    #shopContent h2 { font-size: 5vh; }
    .upgrade-title { font-size: 2.6vh; }
    .upgrade-desc { font-size: 2vh; }
    .buyBtn { font-size: 2.2vh; }
    #closeBtn { font-size: 2.4vh; }
  }
</style>
</head>
<body>

<div id="game">
  <div id="scoreBox">
    <div id="score">0</div>
    <div id="scoreLabel">очки</div>
  </div>

  <div id="sphereWrap">
    <div id="sphere" ontouchstart="window.__hit && window.__hit(event)" onmousedown="window.__hit && window.__hit(event)"></div>
  </div>

  <button id="shopBtn" ontouchstart="window.__openShop && window.__openShop(event)" onmousedown="window.__openShop && window.__openShop(event)" onclick="window.__openShop && window.__openShop(event)">✦ Магазин</button>
</div>

<div id="shopModal">
  <div id="shopContent">
    <h2>МАГАЗИН</h2>

    <div class="upgrade">
      <div class="upgrade-info">
        <div class="upgrade-title">Мультиклик</div>
        <div class="upgrade-desc">+1 к клику (итого +2)</div>
      </div>
      <button class="buyBtn" id="buyMulti" ontouchstart="window.__buyMulti && window.__buyMulti(event)" onmousedown="window.__buyMulti && window.__buyMulti(event)" onclick="window.__buyMulti && window.__buyMulti(event)">50</button>
    </div>

    <button id="closeBtn" ontouchstart="window.__closeShop && window.__closeShop(event)" onmousedown="window.__closeShop && window.__closeShop(event)" onclick="window.__closeShop && window.__closeShop(event)">Закрыть</button>
  </div>
</div>

<script>
(function() {
  // ===== Состояние игры =====
  var score = 0;
  var clickValue = 1;
  var multiOwned = false;

  // ===== DOM =====
  var scoreEl   = document.getElementById('score');
  var sphere    = document.getElementById('sphere');
  var shopBtn   = document.getElementById('shopBtn');
  var shopModal = document.getElementById('shopModal');
  var closeBtn  = document.getElementById('closeBtn');
  var buyMulti  = document.getElementById('buyMulti');

  // ===== Защита от двойного срабатывания =====
  var lastHitTime = 0;
  function canFire() {
    var now = Date.now();
    if (now - lastHitTime < 350) return false;
    lastHitTime = now;
    return true;
  }

  // ===== Рендер счёта =====
  function updateScore() {
    scoreEl.textContent = score;
    scoreEl.classList.add('pop');
    setTimeout(function() { scoreEl.classList.remove('pop'); }, 120);
    refreshShop();
  }

  function refreshShop() {
    if (multiOwned) {
      buyMulti.disabled = true;
      buyMulti.classList.add('owned');
      buyMulti.textContent = 'Куплено';
    } else {
      buyMulti.disabled = score < 50;
      buyMulti.classList.remove('owned');
      buyMulti.textContent = '50';
    }
  }

  // ===== Искры =====
  var sparkColors = ['#00e5ff', '#0ff', '#7cfaff', '#ff47ff', '#a56bff', '#ffffff'];

  function spawnSparks(x, y) {
    var count = 14 + Math.floor(Math.random() * 6);
    for (var i = 0; i < count; i++) {
      (function() {
        var s = document.createElement('div');
        s.className = 'spark';
        var color = sparkColors[Math.floor(Math.random() * sparkColors.length)];
        var size = 6 + Math.random() * 12;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = x + 'px';
        s.style.top = y + 'px';
        s.style.background = color;
        s.style.boxShadow = '0 0 ' + size + 'px ' + color + ', 0 0 ' + (size * 2) + 'px ' + color;
        document.body.appendChild(s);

        var angle = Math.random() * Math.PI * 2;
        var dist = 80 + Math.random() * 160;
        var dx = Math.cos(angle) * dist;
        var dy = Math.sin(angle) * dist;
        var duration = 600 + Math.random() * 400;

        var anim = s.animate(
          [
            { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
            { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(0)', opacity: 0 }
          ],
          { duration: duration, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' }
        );

        if (anim && anim.onfinish !== undefined) {
          anim.onfinish = function() { s.remove(); };
        } else {
          setTimeout(function() { s.remove(); }, duration + 50);
        }
      })();
    }
  }

  // ===== Клик по сфере =====
  function handleHit(e) {
    if (e) {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
    }
    if (!canFire()) return;

    score += clickValue;
    updateScore();

    sphere.classList.add('hit');
    setTimeout(function() { sphere.classList.remove('hit'); }, 100);

    var rect = sphere.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    spawnSparks(cx, cy);

    if (navigator.vibrate) {
      try { navigator.vibrate(15); } catch (err) {}
    }
  }

  // ===== Магазин =====
  function openShop(e) {
    if (e) {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
    }
    refreshShop();
    shopModal.classList.add('open');
  }

  function closeShop(e) {
    if (e) {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
    }
    shopModal.classList.remove('open');
  }

  function buyMultiFunc(e) {
    if (e) {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
    }
    if (multiOwned) return;
    if (score < 50) return;
    score -= 50;
    clickValue = 2;
    multiOwned = true;
    updateScore();
  }

  // ===== Экспорт в window (для inline-обработчиков) =====
  window.__hit = handleHit;
  window.__openShop = openShop;
  window.__closeShop = closeShop;
  window.__buyMulti = buyMultiFunc;

  // ===== Дублирующие подписки через addEventListener =====
  // (для браузеров, которые корректно работают с обычными слушателями)
  function bind(el, fn) {
    if (!el) return;
    el.addEventListener('touchstart', fn, { passive: false });
    el.addEventListener('mousedown', fn);
    el.addEventListener('click', fn);
  }

  bind(sphere, handleHit);
  bind(shopBtn, openShop);
  bind(closeBtn, closeShop);
  bind(buyMulti, buyMultiFunc);

  // Закрытие магазина по клику на фон
  shopModal.addEventListener('click', function(e) {
    if (e.target === shopModal) shopModal.classList.remove('open');
  });

  // ===== Запрет контекстного меню и зума =====
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
  document.addEventListener('touchmove', function(e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  // ===== Инициализация =====
  updateScore();
})();
</script>
</body>
</html>
